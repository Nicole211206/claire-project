server {
    listen 80;
    server_name dev-claire.wecarehosting.com.br;

    # Redireciona HTTP para HTTPS (ativar após certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;

    # Ambiente de STAGING — checkout separado, branch develop, backend numa
    # porta própria (18793) com banco SQLite próprio (claire-staging.db).
    # Espelha produção (claire.wecarehosting.com.br.conf) inclusive na
    # allowlist de segurança — não repetir aqui o erro que corrigimos lá
    # (nginx servindo backend/.git/deploy sem autenticação).
    root /home/jarvis/apps/claire-project-staging;
    index index.html;

    location = /load { proxy_pass http://127.0.0.1:18793; include proxy_params_claire; }
    location = /save { proxy_pass http://127.0.0.1:18793; include proxy_params_claire; }
    location = /upload { proxy_pass http://127.0.0.1:18793; include proxy_params_claire; }
    location = /backups { proxy_pass http://127.0.0.1:18793; include proxy_params_claire; }
    location = /load-backup { proxy_pass http://127.0.0.1:18793; include proxy_params_claire; }
    location = /health { proxy_pass http://127.0.0.1:18793; include proxy_params_claire; }
    location /files/ { proxy_pass http://127.0.0.1:18793; include proxy_params_claire; }
    location /api/ { proxy_pass http://127.0.0.1:18793; include proxy_params_claire; }
    location /hostaway/ { proxy_pass http://127.0.0.1:18793; include proxy_params_claire; }

    # ── Frontend estático — ALLOWLIST, não blocklist (mesmo padrão de produção) ──
    location = / { try_files /index.html =404; }
    location = /index.html { try_files /index.html =404; }
    location = /restaurar.html { try_files /restaurar.html =404; }
    location /css/ { try_files $uri =404; }
    location /js/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }

    location / { return 404; }
}
