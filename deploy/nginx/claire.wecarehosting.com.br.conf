server {
    listen 80;
    server_name claire.wecarehosting.com.br;

    # Redireciona HTTP para HTTPS (ativar após certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;

    # Frontend estático (index.html/css/js/assets) — mesmo checkout de onde o
    # backend roda (repo clonado inteiro, não uma cópia à parte). O front fala
    # com o backend pelo mesmo domínio (window.CLAIRE_SYNC em index.html
    # aponta pra cá), então front e API vivem juntos neste bloco.
    root /home/jarvis/apps/claire-project;
    index index.html;

    # Backend FastAPI (claire-dados) — contrato /load,/save,/upload,/backups,
    # /load-backup,/health, mais /api/* (Jarvis) e /hostaway/* (proxy
    # Hostaway). Essas rotas específicas vencem o catch-all estático abaixo.
    location = /load { proxy_pass http://127.0.0.1:18792; include proxy_params_claire; }
    location = /save { proxy_pass http://127.0.0.1:18792; include proxy_params_claire; }
    location = /upload { proxy_pass http://127.0.0.1:18792; include proxy_params_claire; }
    location = /backups { proxy_pass http://127.0.0.1:18792; include proxy_params_claire; }
    location = /load-backup { proxy_pass http://127.0.0.1:18792; include proxy_params_claire; }
    location = /health { proxy_pass http://127.0.0.1:18792; include proxy_params_claire; }
    location /files/ { proxy_pass http://127.0.0.1:18792; include proxy_params_claire; }
    location /api/ { proxy_pass http://127.0.0.1:18792; include proxy_params_claire; }
    location /hostaway/ { proxy_pass http://127.0.0.1:18792; include proxy_params_claire; }

    # ── Frontend estático — ALLOWLIST, não blocklist ──
    # O `root` acima aponta pro checkout git inteiro (backend/, .git/, deploy/,
    # etc. moram no mesmo diretório). Em vez de um catch-all "serve qualquer
    # arquivo que exista" (que expunha claire.db, .git/HEAD, config.py, etc.
    # sem autenticação nenhuma — incidente de 06/08), só os caminhos abaixo
    # são servidos — qualquer coisa fora dessa lista cai no catch-all final e
    # dá 404. Uma pasta nova que apareça no repo amanhã fica bloqueada por
    # padrão, sem precisar lembrar de adicionar uma regra de deny pra ela.
    location = / { try_files /index.html =404; }
    location = /index.html { try_files /index.html =404; }
    location = /restaurar.html { try_files /restaurar.html =404; }
    location /css/ { try_files $uri =404; }
    location /js/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }

    location / { return 404; }
}

# Bloco SSL — preenchido pelo certbot após emissão do certificado (mesmos
# location blocks do server 80 acima, certbot só acrescenta listen 443 ssl +
# as diretivas ssl_certificate/ssl_certificate_key/include/ssl_dhparam e cria
