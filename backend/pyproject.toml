[project]
name = "claire-dados-backend"
version = "0.1.0"
description = "Backend FastAPI do claire-dados — réplica fiel do worker Cloudflare (KV+D1) em SQLite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]
