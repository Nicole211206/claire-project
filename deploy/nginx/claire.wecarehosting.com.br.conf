server {
    listen 80;
    server_name claire.wecarehosting.com.br;

    # Redireciona HTTP para HTTPS (ativar após certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;

    # Backend FastAPI (claire-dados + proxy Hostaway sob /hostaway) — proxy puro
    # em TODAS as rotas. Diferente do wecare-onboarding: aqui não tem frontend
    # estático pra servir por este nginx — index.html/js/app.js ficam no Netlify
    # (ver netlify.toml no repo) e chamam este domínio só pela API.
    location / {
        proxy_pass         http://127.0.0.1:18792;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

